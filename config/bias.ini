# ============================================================================
#  GnssLab — systematic-bias and RINEX-inventory configuration
#
#  Shared by apps/system_bias (chapter 5.1, TGD / ionospheric / tropospheric
#  diagnostics) and apps/read_rinex (chapter 3.2, RINEX inventory and
#  per-constellation statistics).
#
#  Format: `key = value`, one per line.
#    - A line is a comment only when `#` is its FIRST character. Inline trailing
#      comments are not stripped and become part of the value.
#    - Every key is optional; anything omitted keeps its built-in default.
#    - Relative paths resolve against this file's PARENT directory (the
#      repository root), so the config works from anywhere.
#
#  Full key reference: config/README.md
# ============================================================================

# --- input files ------------------------------------------------------------

# RINEX observation file. The default is the full day-long file, not the trimmed
# data/sample/ copy: these two programs were written against the full dataset,
# and their committed outputs came from it. A fresh clone that has not run
# scripts/download_data.py can still run them on the sample by passing
#     --obs data/sample/WUH200CHN_R_20250010000_01D_30S_MO.rnx
#     --nav data/sample/BRDC00IGS_R_20250010000_01D_MN.rnx
obsFile = data/WUH200CHN_R_20250010000_01D_30S_MO.rnx

# RINEX broadcast navigation file.
navFile = data/BRDC00IGS_R_20250010000_01D_MN.rnx

# --- output -----------------------------------------------------------------

# Both programs write here; neither set of names collides with the other.
# system_bias writes nine files: GPS_TGD_Result.csv, BDS_TGD_Result.csv,
# PL_IonoCompare.csv, GPS_Iono.txt, BDS_Iono.txt, trop_delay_result.txt,
# trop_zhd_zwd.txt, tx_backward_verify.csv, tx_if_single_diff.csv.
# read_rinex writes one: GNSS_Statistics.csv.
#
# Keeping them out of the working directory is the point: the `gnss app` CLI
# runs these with the repository root as the working directory, so the files
# used to land there.
outDir = output/bias

# --- epoch control ----------------------------------------------------------

# Stop after this epoch (YYYY-MM-DDTHH:MM:SS). Comment out to run the whole
# observation file.
#
# ONE value serves BOTH programs, and it is the epoch system_bias has always
# stopped at. read_rinex used to stop 30 minutes earlier, at 00:00:30 — a
# debugging leftover; the epoch it really wanted is visible in its source, where
# a whole-day "23:59:30" sits commented out. It now shares this value and
# therefore processes 123 epochs where it used to process 3.
#
# Do not "tidy" this to 00:00:30 to restore the old read_rinex behaviour: that
# would instead cut system_bias down from 123 epochs to 3, and its nine files
# are the point of that program. See CHANGELOG.md.
stopUTC = 2025-01-01T01:00:30
