# Cycle-slip detection (chapter 7) - shared by cs_detect_mw and cs_detect_gf.
#
# Format: `key = value`, one per line. A '#' only starts a comment when it is
# the first non-blank character on the line - there are no trailing comments.
# Keys are case sensitive and every one of them is optional; anything absent
# keeps its built-in default.
#
# Relative paths resolve against this file's PARENT directory (the repository
# root), not the working directory, so the program runs from anywhere.

#-------------------------------------------------------------------
# Input
#-------------------------------------------------------------------
# The default is the committed sample: a fresh clone has this and nothing else.
obsFile = data/sample/WUH200CHN_R_20250010000_01D_30S_MO.rnx

# The 1 Hz zero-baseline set used in docs/cycle-slip-gf.md is not committed
# (see .gitignore - only data/sample/ is). To run against it, either uncomment
# the line below or pass --obs on the command line:
#obsFile = data/Zero-baseline/oem719-202203031500-1.obs

# Empty means "run to the end of the observation file".
stopUTC =

#-------------------------------------------------------------------
# Output
#-------------------------------------------------------------------
# One file per satellite, plus summary.<mode>.csv. Never the input directory.
outDir = output/cs

#-------------------------------------------------------------------
# Constellations
#-------------------------------------------------------------------
GPS = 1
BD2 = 1

#-------------------------------------------------------------------
# Detector parameters
#-------------------------------------------------------------------
# Epoch gap treated as an interruption of the arc: tracking is re-acquired with
# a new initial phase, so the ambiguity difference across the gap is meaningless
# and no judgement is made. The textbook suggests 30 min; 120 s is stricter and
# is what the MW example program has always used.
deltaTMax = 120

# Absolute detection threshold, metres.
#
# This is NOT a wavelength multiple. The smallest slip the GF combination can
# resolve is |lambda1 - lambda2| = 0.0539 m (GPS), and putting the threshold at
# that value detects such a slip only about half the time - a threshold has to
# sit below the smallest signal it must catch. 0.030 m is 0.56x of it, which
# holds the false-alarm rate at zero on 1 Hz static data.
#
# Revisit this for 30 s sampling: the ionospheric term reaches 10-30 mm per
# epoch even in a quiet ionosphere, so a single epoch difference cannot use a
# 0.030 m threshold there. The polynomial detector is the answer; see
# docs/cycle-slip-gf.md.
threshold = 0.030

# Sliding-window length for the polynomial-fit detector, epochs.
gfPolyWindow = 30
