# ============================================================================
#  GnssLab — broadcast-versus-precise ephemeris configuration
#
#  Shared by apps/bds_eph (chapter 4.1, one satellite at one epoch) and
#  apps/bds_gps_diff (a satellite set swept over a time series).
#
#  Format: `key = value`, one per line.
#    - A line is a comment only when `#` is its FIRST character. Inline trailing
#      comments are not stripped and become part of the value.
#    - Every key is optional; anything omitted keeps its built-in default.
#    - Relative paths resolve against this file's PARENT directory (the
#      repository root), so the config works from anywhere.
#    - A LIST is written as one comma-separated line; see satList below.
#
#  Full key reference: config/README.md
# ============================================================================

# --- files ------------------------------------------------------------------

# RINEX broadcast navigation file.
navFile = data/BRDC00IGS_R_20250010000_01D_MN.rnx

# MGEX precise orbit, the reference the broadcast orbit is compared against.
# NOT committed — see data/README.md for the download. Both programs need it,
# which also means neither can be run from data/sample/ alone: the sample
# carries the observation and navigation files but no SP3.
sp3File = data/WUM0MGXFIN_20250010000_01D_05M_ORB.SP3

# --- output -----------------------------------------------------------------

# bds_gps_diff writes sat_pos_vel_diff_<yyyymmdd>.csv here, named after the
# start date below. bds_eph writes no files at all — it prints its report and
# exits — so this key is unused by it, and it takes no --out-dir option either.
outDir = output/eph

# --- bds_eph: one satellite at one epoch ------------------------------------

# Satellite to compare, e.g. "C01".
targetSat = C01

# The epoch to evaluate (YYYY-MM-DDTHH:MM:SS).
targetUTC = 2025-01-01T00:05:00

# --- bds_gps_diff: a satellite set over a time series -----------------------

# Comma-separated; tokens are trimmed and blank ones ignored. The ORDER IS
# PRESERVED — it is the order the rows are written in, so reordering this line
# reorders the CSV.
#
# Note the committed sample navigation file carries only C01 and C05 of these
# six, so a run against the sample silently produces rows for those two and
# skips the rest. Pass --sats to narrow the list.
satList = G02, G15, C01, C05, C11, C20

# First epoch of the series (YYYY-MM-DDTHH:MM:SS). Also names the output file,
# so a series starting on another day gets a filename that says so.
startUTC = 2025-01-01T00:00:00

# Number of epochs to process. The default is one full day at 30 s.
epochCount = 2880

# Seconds between epochs. The SP3 product is sampled every 5 minutes, so the
# intermediate epochs rely on the orbit interpolation.
interval = 30.0
