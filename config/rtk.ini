# RTK single-epoch least-squares float solution (chapter 8, exercise 1).
#
# Format: `key = value`, one per line. A '#' only starts a comment when it is
# the first non-blank character on the line - there are no trailing comments.
# Keys are case sensitive and every one of them is optional; anything absent
# keeps its built-in default.
#
# Relative paths resolve against this file's PARENT directory (the repository
# root), not the working directory, so the program runs from anywhere.

#-------------------------------------------------------------------
# Input
#-------------------------------------------------------------------
# RTK is relative positioning, so it needs TWO observation files: a rover and a
# base receiver that were tracking at the same times. Nothing else in the
# project takes two.
#
# The only such pair in the project is data/Zero-baseline/, which is gitignored
# (about 95 MB per file, see .gitignore - only data/sample/ is committed). A
# fresh clone therefore has these paths pointing at files that are not there and
# must supply its own with --obs and --base-obs.
obsFile     = data/Zero-baseline/oem719-202203031500-1.obs
baseObsFile = data/Zero-baseline/oem719-202203031500-2.obs
navFile     = data/Zero-baseline/BRDC00IGS_R_20220620000_01D_MN.rnx

# Empty means "run to the end of the observation file". The zero-baseline set is
# 1 Hz over about two hours - roughly 8000 epochs, which takes a while and gives
# a proper accuracy sample.
#
# For a quick check against the frozen baseline, pass
#   --stop 2022-03-03T06:49:00
# on the command line. That is the window the original program's output in
# data/Zero-baseline/oem719-202203031500-1.obs.rtk.lsq.out covers (25 epochs,
# sod 24517..24541), and it is what tests/test_rtk_float_regression.py uses.
stopUTC =

#-------------------------------------------------------------------
# Output
#-------------------------------------------------------------------
# Two files per run: <rover>_<sys>_rtk_float.out (the textbook's solution
# format) and <rover>_<sys>_rtk_diag.csv (per-epoch conditioning and post-fit
# statistics). Never the input directory.
outDir = output/rtk

#-------------------------------------------------------------------
# Constellation and frequency pair
#-------------------------------------------------------------------
# gps    GPS    L1/L2    RINEX C1C + C2W    1575.420 / 1227.600 MHz
# bds2   BDS-2  B1I/B2I  RINEX C2I + C7I    1561.098 / 1207.140 MHz
# bds3   BDS-3  B1I/B2a  RINEX C2I + C5P    1561.098 / 1176.450 MHz
# bds23  both BeiDou generations in one solution; each satellite takes whichever
#        second frequency it has (BDS-2 B2I, BDS-3 B2a). Pair with estimateISB.
# gpsbds GPS + BeiDou in one solution. The only mode with two constellations;
#        it uses one reference satellite per constellation, and the two blocks
#        share only the coordinates. The two quota keys below apply to it.
#
# Run one mode at a time and compare. Until gpsbds existed the solver took one
# constellation per run because the double difference needs a single reference
# satellite, and a mixed system needs one per constellation.
#
# The two BeiDou entries are NOT interchangeable and neither contains the other.
# The generations broadcast different second frequencies - BDS-2 has B2I but no
# B2a, BDS-3 has B2a but no B2I - so:
#
#   bds2  restricts the solution to BDS-2 satellites (IGSO/MEO, clustered over
#         the Asia-Pacific; six satellites on the zero-baseline set)
#   bds3  restricts it to BDS-3 satellites (MEO; also six there)
#
# and they do not agree: on the zero-baseline set bds2 lands about 0.9 m out and
# bds3 about 0.06 m out. Believing that B1I/B2I covers "BeiDou" is the mistake
# this file exists to prevent. See docs/rtk.md.
sys = gps

#-------------------------------------------------------------------
# Mixed GPS + BeiDou: BeiDou orbital-family quota
#-------------------------------------------------------------------
# Relative number of GEO : IGSO : MEO satellites to carry in a gpsbds run.
# Three non-negative integers; 0 excludes that family even without a cap. With
# bdsMaxSats = 0 every satellite of the enabled families is used; with a
# positive cap the ratio allocates the slots. Within a family the
# highest-elevation satellites are kept.
#
# The families are not equal citizens. A GEO is stationary: its geometry is
# fixed for the whole run. An IGSO is high over the Asia-Pacific but stays over
# one longitude. A MEO sweeps a different sky over the run and is the best of
# the three for geometry. The tables in docs/rtk.md measure which ratio helps on
# this dataset; this default is the neutral starting point, not a tuned value.
bdsOrbitRatio = 1,1,1

# Total BeiDou satellites in a gpsbds run. 0 = no cap, use every candidate.
# A positive value allocates slots by bdsOrbitRatio. Also --bds-max-sats.
bdsMaxSats = 0

#-------------------------------------------------------------------
# Code observation weighting (per system, per BeiDou orbital family)
#-------------------------------------------------------------------
# Multipliers on the linearizer's code sigma. The built-in sigma is 0.3 m
# (phase 0.003 m); these scale the CODE sigma only:
#
#     effective sigma = 0.3 m * systemFactor * orbitFactor
#     weight          = 1 / effective sigma^2
#
# >1 means "trust this family less" (larger sigma -> smaller weight);
# <1 means "trust it more". All 1.0 leaves every number unchanged.
#
# The factors are applied after the single-point solve and before the station
# and satellite differences, so they change the RTK double-difference weights
# (including --dd-cov) but NOT the spp: column. The orbit factor multiplies the
# generation factor for BDS and is ignored for GPS.
#
# The chapter's mixed-solution ablation (docs/rtk.md section 12) measures what
# these do on the zero baseline. They are a tuning knob, not a model: set them
# from data, not by intuition. On that dataset the best measured set was
#
#     codeSigmaFactorGPS = 2.0    # GPS code is the noisiest here
#     codeSigmaFactorBD3 = 0.7    # BDS-3 MEO is the cleanest
#     codeSigmaFactorMEO = 0.7
#
# which took the mixed float 3-D RMS from 0.0866 m to 0.0621 m (fixed solution
# unchanged at 0.0120 m). GPS=2.0 plus BD3=0.7 alone gives 0.0642 m and has one
# fewer knob. These values are specific to this receiver pair and this 2.2-hour
# zero baseline; do not carry them to a real baseline without re-running the
# ablation.
codeSigmaFactorGPS = 1.0
codeSigmaFactorBD2 = 1.0
codeSigmaFactorBD3 = 1.0
codeSigmaFactorGEO = 1.0
codeSigmaFactorIGSO = 1.0
codeSigmaFactorMEO = 1.0

#-------------------------------------------------------------------
# Model
#-------------------------------------------------------------------
# Elevation mask for the observation equations, degrees.
#
# Pinned at 10 rather than tuned: that is SPPIFCode's own constructor default,
# and the frozen oem719-...obs.rtk.lsq.out baseline was produced with it. Change
# it and that comparison no longer means what it says.
cutOffElevation = 10

# Apply the troposphere-delay correction in the single-point solves. 0/1.
#
# There is exactly ONE model here: Saastamoinen zenith delay, a Niell dry mapping
# function, and a simplified 1/(sinE+0.00095) wet mapping. config/spp.ini offers
# the same switch as an integer `tropModel` with a "1 Hopfield, 2 Saastamoinen,
# 3 Neill" comment - that comment is stale, every non-zero value runs the one
# Saastamoinen path - so this file uses a bool rather than repeat the pretence.
#
# Left OFF on purpose. The correction moves the rover's single-point position,
# and the rtk: column is xyzRover + dxyzRTK, so switching it on breaks the
# byte-for-byte comparison against oem719-...obs.rtk.lsq.out in
# tests/test_rtk_float_regression.py. Turn it on to measure what the missing
# model was costing the spp: column - that is what the switch is for. Also
# available as --trop.
enableTrop = 0

# Apply the BeiDou broadcast TGD correction (TGD1 to C2, TGD2 to C7) in the
# single-point solves. 0/1. GPS already has its TGD folded into the satellite
# clock, so this only changes bds2 / bds3 / bds23. Also --bds-tgd on the command
# line. Off for the same byte-exactness reason as above.
enableBDSTGD = 0

#-------------------------------------------------------------------
# BeiDou inter-system bias
#-------------------------------------------------------------------
# Estimate one receiver inter-system bias between the two BeiDou generations
# (BDS-3 relative to BDS-2), in metres. Only meaningful with sys = bds23; also
# available as the --isb flag.
#
# The two generations do not share a receiver bias - different signal paths
# (B2I vs B2a) and different broadcast clock datums - so a double difference
# that spans the two carries a term a within-generation one does not. With this
# off the solver assumes they do share one, which is the point of the exercise:
# run it both ways and look at what changes.
#
# The parameter is added to the PSEUDORANGE equations only. On the carrier
# phase it is not separable from the ambiguity - a shared constant added to
# every equation of one generation can be taken straight back out of each
# satellite's ambiguity, leaving the equations unchanged - and estimating it
# there measurably wrecks the ambiguity resolution (median ratio 1453 -> 6.5,
# fixed rate 96.7% -> 91.6% on the zero baseline). See docs/rtk.md §九.
#
# Measured on data/Zero-baseline: about -12 mm with 19 mm of per-epoch scatter,
# i.e. zero within the noise. Mixing the generations costs nothing there.
estimateISB = 0

#-------------------------------------------------------------------
# Ambiguity fixing
#-------------------------------------------------------------------
# Resolve the double-difference ambiguities to integers with MLAMBDA and write
# the result to <rover>_<sys>_rtk_fixed.out as well (textbook 8.3.5). Also
# available as the --fix command-line flag; --ratio implies it.
#
# Left OFF here on purpose. With fixing off the program is unchanged, so the
# frozen oem719-...obs.rtk.lsq.out baseline still compares byte for byte - which
# is the only external anchor the chapter has. Turn it on to answer exercise 2.
#
# Fixing is what lets the carrier phase constrain the position at all: in the
# float solution every phase equation carries its own free ambiguity, so the
# ambiguities absorb the phase residual exactly and the phase contributes no
# information about the coordinates. A wrongly fixed epoch is much worse than a
# float one - the error is the integer slip, in metres - so read the ratio.
fixAmbiguity = 0

# Ratio-test threshold R_thres, equation (8.61). A fix counts as accepted when
# the ratio is STRICTLY greater than this, and the ratio is a quotient of
# residual sums of squares, so it is >= 1 for any successful search. The notes
# suggest 2 or 3 and use 3.
#
# This is a threshold on a reported number and nothing more: the fixed
# coordinates are written either way. The `fixed` column of the diagnostics CSV
# is this test already applied; a consumer that needs a guaranteed-good solution
# must filter on it or on `ratio` itself.
ratioThreshold = 3.0
