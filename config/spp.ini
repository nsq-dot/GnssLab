# ============================================================================
#  GnssLab — SPP / velocity solver configuration
#
#  This profile REPRODUCES THE REGRESSION BASELINE in tests/baseline/.
#  Do not change cutOffElevation or the sigma values here: the baseline was
#  produced at an elevation mask of 10 deg with the solver's built-in code
#  sigma of 1.0 m, and the weight used is 1/sigma^2, so a "small" change moves
#  the solution measurably. Use config/spp.tuned.ini for experiments.
#
#  Format: `key = value`, one per line.
#    - A line is a comment only when `#` is its FIRST character. Inline trailing
#      comments are not stripped and become part of the value.
#    - Every key is optional; anything omitted keeps its built-in default.
#    - Relative paths resolve against THIS FILE's directory, not the current
#      working directory, so the config works from anywhere.
#
#  Full key reference: config/README.md
# ============================================================================

# --- input files ------------------------------------------------------------

# RINEX observation file.
obsFile = data/WUH200CHN_R_20250010000_01D_30S_MO.rnx

# RINEX broadcast navigation file. Download from an IGS data centre; see
# data/README.md.
navFile = data/BRDC00IGS_R_20250010000_01D_MN.rnx

# --- output -----------------------------------------------------------------

# Directory for solver output. The program writes:
#   <obsBase>_DUAL_IF.spp.out   position, per epoch
#   <obsBase>_pos_vel.out       position + ENU velocity + clock drift
outDir = output

# --- epoch control ----------------------------------------------------------

# Stop after this epoch (YYYY-MM-DDTHH:MM:SS). Comment out to run the whole
# observation file.
stopUTC = 2025-01-01T00:30:30

# --- constellations ---------------------------------------------------------
# Used by the single-point programs that select systems explicitly.

GPS = 1
BD2 = 1
BD3 = 1
Galileo = 0
GLONASS = 0

# --- solver -----------------------------------------------------------------

# Elevation mask in degrees. 10 reproduces the baseline; see the header note.
cutOffElevation = 10

# 1: ionosphere-free code combination. This is the only mode implemented.
obsModel = 1

# Tropospheric model: 1 Hopfield, 2 Saastamoinen, 3 Neill.
tropModel = 1

# Apply the BeiDou broadcast TGD correction. Set to 0 to see its effect.
enableBDSTGD = 1

# 1: Least Squares. 2 (Kalman) is not yet wired up - see docs/roadmap.md.
estimator = 1


# --- reserved: parsed but not yet consumed by any solver --------------------
# These round-trip through the config but currently have no effect. They are
# kept so config files remain forward-compatible, and so the intended settings
# are recorded. See config/README.md.

# Klobuchar only, and only on the single-frequency path.
ionoModel = 1

# Minimum satellites required for a solution.
minSatNum = 4

# Maximum geometric dilution of precision.
maxGDOP = 10

# Observation sigmas. The current SPP solver carries a single scalar sigma for
# the ionosphere-free combination, so these per-constellation values are not
# applied individually.
noiseGPSCode = 1.0
noiseBD2Code = 1.0
noiseBD3Code = 1.0
