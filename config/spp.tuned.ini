# ============================================================================
#  GnssLab — experimental profile
#
#  Copies config/spp.ini but raises the elevation mask and tightens the code
#  sigma. Neither default is "wrong" - this is a different estimator weighting,
#  and it will NOT reproduce tests/baseline/.
#
#  Use it to explore the sensitivity of the solution:
#      apps/spp_if config/spp.tuned.ini
#
#  What changes, and why it matters:
#
#   * cutOffElevation 10 -> 15. Dropping low-elevation satellites removes the
#     noisiest observations, at the cost of geometry (a higher DOP).
#
#   * sigma 1.0 -> 0.3 m. The weight applied is 1/sigma^2, so this multiplies
#     every observation weight by about 11x. In a pure least-squares sense a
#     uniform weight change rescales the covariance but not the estimate - but
#     the sigma does not enter uniformly here (the ionosphere-free combination
#     is weighted, and elevation-dependent terms are applied in other modes), so
#     the position will move slightly.
# ============================================================================

obsFile = data/WUH200CHN_R_20250010000_01D_30S_MO.rnx
navFile = data/BRDC00IGS_R_20250010000_01D_MN.rnx
outDir = output/tuned

stopUTC = 2025-01-01T00:30:30

GPS = 1
BD2 = 1
BD3 = 1
Galileo = 0
GLONASS = 0

cutOffElevation = 15
obsModel = 1
tropModel = 1
enableBDSTGD = 1
estimator = 1

# Pulled in from the reserved block so the tighter sigma actually takes effect:
# noiseGPSCode feeds SPPIFCode::setSigIFCode().
noiseGPSCode = 0.3

ionoModel = 1
minSatNum = 4
maxGDOP = 10
noiseBD2Code = 1.0
noiseBD3Code = 1.0
